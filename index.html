<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Parcourez les films populaires et cherchez dans le catalogue The Movie Database."
    />
    <meta
      name="theme-color"
      content="#fbfbfd"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <title>TMDB Discovery</title>

    <!--
      Splash screen styles are inlined so the first paint is already the
      finished splash, before any stylesheet or script has loaded.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        margin: 0;
        background: #fbfbfd;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #fbfbfd;
        color: #1d1d1f;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        transition: opacity 0.45s ease;
      }

      #splash[data-hiding='1'] {
        opacity: 0;
        pointer-events: none;
      }

      .splash__mark {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        background: #0071e3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash__mark svg {
        width: 38px;
        height: 38px;
      }

      .splash__word {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .splash__track {
        position: relative;
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: #e8e8ed;
        overflow: hidden;
      }

      .splash__track::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 2px;
        background: #86868b;
        animation: splash-slide 1.1s ease-in-out infinite;
      }

      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__track::after {
          animation: none;
          width: 100%;
        }
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #000000;
        }

        #splash {
          background: #000000;
          color: #f5f5f7;
        }

        .splash__track {
          background: #1d1d1f;
        }

        .splash__track::after {
          background: #86868b;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de l'application">
      <div class="splash__mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path
            d="M25 20.5 L44.5 32 L25 43.5 Z"
            fill="#ffffff"
            stroke="#ffffff"
            stroke-width="5.5"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <span class="splash__word">TMDB Discovery</span>
      <div class="splash__track" aria-hidden="true"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/front-end/main.tsx"></script>

    <!--
      Safety net: if the app never boots (a failed bundle, a JS error), the
      splash still gets out of the way instead of hiding the page forever.
    -->
    <script>
      setTimeout(function () {
        var splash = document.getElementById('splash');
        if (splash && splash.dataset.hiding !== '1') {
          splash.dataset.hiding = '1';
          setTimeout(function () {
            splash.remove();
          }, 450);
        }
      }, 8000);
    </script>
  </body>
</html>
