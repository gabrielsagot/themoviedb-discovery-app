name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest

    env:
      # Git hooks are a local safety net; the checks below are the real gate.
      HUSKY: 0

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b --force

      - name: Run unit tests
        run: npm test
